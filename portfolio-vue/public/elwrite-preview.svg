<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ELWrite editor preview</title>
  <desc id="desc">A focused writing application interface with a document editor, formatting tools, and a document library.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191527"/><stop offset="1" stop-color="#30204a"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c59bff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
  <rect width="1200" height="800" fill="url(#bg)"/><rect x="54" y="42" width="1092" height="716" rx="24" fill="#14121e" stroke="#d4baff" stroke-opacity=".16"/><rect x="54" y="42" width="238" height="716" rx="24" fill="#1c1829"/>
  <text x="91" y="102" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">EL<tspan fill="#c59bff">Write</tspan></text><text x="91" y="137" fill="#9588a9" font-family="Arial, sans-serif" font-size="12">A QUIET PLACE TO WRITE</text><rect x="82" y="180" width="182" height="45" rx="11" fill="#c59bff"/><text x="108" y="209" fill="#211832" font-family="Arial, sans-serif" font-size="14" font-weight="700">+ New document</text>
  <text x="91" y="270" fill="#817594" font-family="Arial, sans-serif" font-size="11">YOUR LIBRARY</text><g font-family="Arial, sans-serif"><rect x="78" y="291" width="190" height="58" rx="10" fill="#2c2340"/><text x="98" y="316" fill="#eee8f8" font-size="13">Untitled draft</text><text x="98" y="336" fill="#9d8fb2" font-size="10">Edited just now</text><text x="98" y="382" fill="#d1c3e7" font-size="13">Brand story notes</text><text x="98" y="402" fill="#817594" font-size="10">Yesterday</text><text x="98" y="448" fill="#d1c3e7" font-size="13">Project reflection</text><text x="98" y="468" fill="#817594" font-size="10">May 18, 2026</text></g><circle cx="152" cy="674" r="28" fill="#c59bff" opacity=".18"/><text x="191" y="670" fill="#eee8f8" font-size="13" font-family="Arial, sans-serif">Elyx Studio</text><text x="191" y="690" fill="#817594" font-size="11" font-family="Arial, sans-serif">Personal workspace</text>
  <rect x="292" y="42" width="854" height="716" rx="24" fill="#f8f6fb"/><rect x="292" y="42" width="854" height="58" rx="24" fill="#f0ecf6"/><circle cx="324" cy="71" r="6" fill="#c5b7d8"/><circle cx="345" cy="71" r="6" fill="#c5b7d8"/><circle cx="366" cy="71" r="6" fill="#c5b7d8"/><text x="422" y="76" fill="#6e637b" font-family="Arial, sans-serif" font-size="12">Untitled draft</text><rect x="1010" y="56" width="98" height="30" rx="15" fill="#7c5cff"/><text x="1034" y="75" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700">Publish</text>
  <rect x="334" y="122" width="770" height="42" rx="9" fill="#f0ecf6"/><g fill="#776b86" font-family="Arial, sans-serif" font-size="15" font-weight="700"><text x="358" y="149">B</text><text x="389" y="149" font-style="italic">I</text><text x="420" y="149" text-decoration="underline">U</text><text x="465" y="149">H1</text><text x="510" y="149">H2</text><text x="558" y="149">•</text><text x="598" y="149">☷</text></g><line x1="638" y1="135" x2="638" y2="153" stroke="#d0c6dc"/><text x="666" y="149" fill="#9e92aa" font-family="Arial, sans-serif" font-size="13">Writing mode</text>
  <text x="412" y="236" fill="#251d31" font-family="Georgia, serif" font-size="40" font-weight="700">A room for ideas</text><text x="414" y="278" fill="#91869b" font-family="Arial, sans-serif" font-size="13">A new note · May 18, 2026</text><line x1="414" y1="304" x2="1048" y2="304" stroke="#e4deea"/>
  <g fill="#41364d" font-family="Georgia, serif" font-size="18"><text x="414" y="356">The best work often begins with a little space</text><text x="414" y="387">to think. ELWrite keeps the interface quiet,</text><text x="414" y="418">so the words can take the lead.</text><text x="414" y="474">Capture a thought, shape a story, and return</text><text x="414" y="505">to it whenever inspiration calls.</text></g><rect x="414" y="548" width="4" height="64" rx="2" fill="#7c5cff"/><text x="434" y="576" fill="#7b6a8e" font-family="Georgia, serif" font-size="16" font-style="italic">“Make room for the next sentence.”</text><text x="414" y="680" fill="#a095aa" font-family="Arial, sans-serif" font-size="11">248 words · 2 min read</text><text x="1033" y="680" fill="#7c5cff" font-family="Arial, sans-serif" font-size="11">Saved</text>
</svg>