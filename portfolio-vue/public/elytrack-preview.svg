<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ElyTrack logistics dashboard preview</title>
  <desc id="desc">A dark logistics tracking dashboard with a route map, shipment statuses, and delivery metrics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151d"/><stop offset="1" stop-color="#102a35"/></linearGradient><linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52e0c4"/><stop offset="1" stop-color="#48a5ff"/></linearGradient></defs>
  <rect width="1200" height="800" fill="url(#bg)"/><rect x="54" y="42" width="1092" height="716" rx="24" fill="#0b1820" stroke="#6de8d0" stroke-opacity=".16"/>
