  <rect x="78" y="181" width="176" height="48" rx="10" fill="#52e0c4"/><text x="104" y="211" fill="#092329" font-family="Arial, sans-serif" font-size="14" font-weight="700">Overview</text><g fill="#8aa8ab" font-family="Arial, sans-serif" font-size="14"><text x="104" y="274">Live shipments</text><text x="104" y="326">Fleet</text><text x="104" y="378">Analytics</text><text x="104" y="430">Team settings</text></g><g fill="#52e0c4"><circle cx="94" cy="268" r="4"/><circle cx="94" cy="320" r="4"/><circle cx="94" cy="372" r="4"/><circle cx="94" cy="424" r="4"/></g>
  <circle cx="144" cy="671" r="27" fill="#52e0c4" opacity=".2"/><text x="183" y="667" fill="#ecfffb" font-family="Arial, sans-serif" font-size="13">Elyx Operations</text><text x="183" y="688" fill="#6d9396" font-family="Arial, sans-serif" font-size="11">Administrator</text>
  <text x="318" y="103" fill="#f4fffd" font-family="Arial, sans-serif" font-size="29" font-weight="700">Operations overview</text><text x="318" y="135" fill="#71949a" font-family="Arial, sans-serif" font-size="14">Everything moving, at a glance.</text><rect x="960" y="82" width="130" height="38" rx="19" fill="#102f36" stroke="#52e0c4" stroke-opacity=".5"/><circle cx="985" cy="101" r="5" fill="#52e0c4"/><text x="998" y="106" fill="#b8ebe3" font-family="Arial, sans-serif" font-size="12">Live data</text>
